[package]
name = "codegen-runner"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
proc-macro2 = "1"
quote = "1"
xsd-parser = { path = "../../vendor/xsd-parser/xsd-parser" }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"
panic = "abort"
