[workspace]
members = ["crates/*"]
exclude = ["scripts/codegen-runner", "examples/*"]
resolver = "2"

# Workspace dependencies (upstream crates.io releases).
# Patched below: the AZX-PBC-OSS xsd-parser fork carries two things that have
# not shipped on crates.io yet (xsd-parser 1.5.3 / xsd-parser-types 0.2.2
# pending): the quick-xml 0.38 -> 0.41 bump and the runtime fix that skips
# elements absent from the content model instead of erroring
# (https://github.com/Bergmann89/xsd-parser/issues/293, fixed by
# https://github.com/Bergmann89/xsd-parser/pull/294). Pinned to an exact rev
# so builds are reproducible; drop the patch once upstream releases.
[workspace.dependencies]
quick-xml = "0.41"
regex = "1.11"
xsd-parser-types = { version = "0.2.1", features = ["quick-xml"] }

# Intra-workspace deps live here so a version bump touches one block, not
# every member manifest. Members declare these with `{ workspace = true }`.
hpxml-common = { version = "0.2.0", path = "crates/hpxml-common" }
hpxml-core = { version = "0.2.0", path = "crates/hpxml-core" }
hpxml-types-v2 = { version = "0.2.0", path = "crates/hpxml-types-v2" }
hpxml-types-v3 = { version = "0.2.0", path = "crates/hpxml-types-v3" }
hpxml-types-v4 = { version = "0.2.0", path = "crates/hpxml-types-v4" }
hpxml-types-v5 = { version = "0.2.0", path = "crates/hpxml-types-v5" }

[workspace.lints.rust]
warnings = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.86"
authors = ["HPXML-RS Contributors"]
keywords = ["hpxml", "xml", "parser", "xsd"]
readme = "README.md"
homepage = "https://github.com/AZX-PBC-OSS/hpxml-rs"
repository = "https://github.com/AZX-PBC-OSS/hpxml-rs"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dist]
inherits = "release"
codegen-units = 1
debug = 0
strip = "symbols"
panic = "abort"

[patch.crates-io]
xsd-parser = { git = "https://github.com/AZX-PBC-OSS/xsd-parser", rev = "b2b672aa60a5f032878662aa94f6e554666a9091" }
xsd-parser-types = { git = "https://github.com/AZX-PBC-OSS/xsd-parser", rev = "b2b672aa60a5f032878662aa94f6e554666a9091" }
