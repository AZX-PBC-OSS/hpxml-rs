name: Release

# Publish to crates.io via Trusted Publishing (OIDC), mirroring the
# `publish-crate` job in AZX-PBC-OSS/tors: explicit OIDC token acquisition
# via rust-lang/crates-io-auth-action, no API token secret anywhere.
# Each crate needs a one-time trusted-publisher entry on crates.io
# (see docs/releasing.md).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify without uploading)"
        type: boolean
        default: true

# Only one release at a time; never cancel a publish in flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates in dependency order
    # Releases ship from main or from a version tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token secret needed or used.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          FLAGS="--locked"
          # Tag pushes always publish for real; manual dispatches honor the
          # dry_run input (default true). inputs.dry_run is empty on push
          # events, so tags can never dry-run by accident.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          publish() {
            echo "--- publishing $1 ---"
            # shellcheck disable=SC2086
            cargo publish $FLAGS --package "$1"
          }
          wait_for_index() {
            echo "waiting $1s for crates.io indexing..."
            sleep "$1"
          }
          publish hpxml-common
          wait_for_index 60
          publish hpxml-types-v2
          wait_for_index 30
          publish hpxml-types-v3
          wait_for_index 30
          publish hpxml-types-v4
          wait_for_index 30
          publish hpxml-types-v5
          wait_for_index 60
          publish hpxml-core
          wait_for_index 60
          publish hpxml
