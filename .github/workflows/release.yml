name: Release

# Publish to crates.io via Trusted Publishing (OIDC). No API tokens:
# cargo exchanges the GitHub OIDC token automatically. Each crate needs a
# one-time trusted-publisher entry on crates.io (see docs/releasing.md).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify without uploading)"
        type: boolean
        default: true

# Only one release at a time; never cancel a publish in flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates in dependency order
    # Releases only ship from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: |
          FLAGS="--locked"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          publish() {
            echo "--- publishing $1 ---"
            # shellcheck disable=SC2086
            cargo publish $FLAGS --package "$1"
          }
          wait_for_index() {
            echo "waiting $1s for crates.io indexing..."
            sleep "$1"
          }
          publish hpxml-common
          wait_for_index 60
          publish hpxml-types-v2
          wait_for_index 30
          publish hpxml-types-v3
          wait_for_index 30
          publish hpxml-types-v4
          wait_for_index 30
          publish hpxml-types-v5
          wait_for_index 60
          publish hpxml-core
          wait_for_index 60
          publish hpxml
