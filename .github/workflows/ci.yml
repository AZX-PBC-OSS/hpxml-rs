name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --locked -- -D warnings

      - name: Doc build
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --all-features --locked

  drift:
    name: Codegen drift and publish check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Codegen drift check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/codegen.sh
          git diff --exit-code
          if [ -n "$(git status --porcelain crates/)" ]; then
            echo "Untracked generated files detected:"
            git status --porcelain crates/
            exit 1
          fi

      # Dry-run publish for crates whose dependencies are all on crates.io.
      # hpxml-core and hpxml depend on workspace siblings, so `cargo publish`
      # for them only succeeds once those siblings are actually published;
      # at release time run the same commands in dependency order
      # (see docs/releasing.md). Here we additionally verify their package
      # file lists, which needs no index access.
      - name: Publish dry-run (leaf crates)
        run: |
          cargo publish --dry-run --allow-dirty --package hpxml-common
          cargo publish --dry-run --allow-dirty --package hpxml-types-v2
          cargo publish --dry-run --allow-dirty --package hpxml-types-v3
          cargo publish --dry-run --allow-dirty --package hpxml-types-v4
          cargo publish --dry-run --allow-dirty --package hpxml-types-v5
          cargo package --allow-dirty --list --package hpxml-core > /dev/null
          cargo package --allow-dirty --list --package hpxml > /dev/null

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-audit@0.22.0,cargo-deny@0.18.0

      # Fails on new advisories. Known quick-xml 0.38 issues are documented
      # with justification in .cargo/audit.toml until upstream xsd-parser
      # publishes types built on quick-xml >= 0.41.
      # Audit every lockfile: the workspace plus the two standalone
      # manifests excluded from it (codegen-runner, compile-check example).
      - name: Audit
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file scripts/codegen-runner/Cargo.lock
          cargo audit --deny warnings --file examples/codegen-compile-check/Cargo.lock

      - name: License and ban check
        # The workspace (shipped library) gets the full policy. The standalone
        # codegen manifests are build-time tools whose duplicate transitive
        # deps (e.g. syn 2/3 via xsd-parser's url stack) never ship, so bans
        # are scoped to licenses+sources there.
        run: |
          cargo deny check licenses bans sources
          cargo deny --manifest-path scripts/codegen-runner/Cargo.toml check licenses sources
          cargo deny --manifest-path examples/codegen-compile-check/Cargo.toml check licenses sources

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86
        with:
          toolchain: "1.86"
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo check --workspace --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked
