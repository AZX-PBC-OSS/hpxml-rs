name: Commitlint

# Enforces Conventional Commits on the PR *title*, which is what lands on main
# under squash-merge and is therefore what release automation parses to decide
# the next version. Actions are SHA-pinned, bumped by Dependabot's
# `github-actions` ecosystem.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA, bumped by Dependabot's `github-actions`
      # ecosystem.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
          subjectPattern: ^[a-z].+
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with a lowercase letter.
