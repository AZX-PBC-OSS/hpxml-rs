# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Every runtime dependency must be under a permissive license compatible
# with the workspace BSD-3-Clause. The current tree (quick-xml, regex,
# xsd-parser-types and their transitive deps) uses only MIT / Apache-2.0 /
# BSD-3-Clause / Unicode-3.0 / Unlicense.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The AZX-PBC-OSS xsd-parser fork is pinned in the root [patch.crates-io]
# (and scripts/codegen-runner) until upstream ships the skip-unknown-elements
# fix and the quick-xml 0.41 bump; see the [patch.crates-io] comment in the
# root Cargo.toml.
allow-git = ["https://github.com/AZX-PBC-OSS/xsd-parser"]
